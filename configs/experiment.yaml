seed: 19

data:
  train_glob: "data/rgc_response/train/*.h5"
  validation_glob: "data/rgc_response/validation/*.h5"
  test_glob: "data/rgc_response/test/*.h5"
  sequence_steps: 320

model:
  type_prior_path: "configs/rgc_type_priors.yaml"
  support_radius_degs: 0.20
  readout_rate_tau_ms: 50.0
  surrogate_slope: 5.0

training:
  burn_in_steps: 64
  differentiable_steps: 256
  checkpoint_block_steps: 32
  batch_size: 4
  max_optimizer_steps: 6000
  learning_rate: 0.0002
  gradient_clip_norm: 1.0
  validation_interval_steps: 100
  learn_cell_residuals: true
  supervised_tail_steps: null

evaluation:
  rf_lag_steps: 64
  recovery_delays_ms: [0, 100, 200, 500]
