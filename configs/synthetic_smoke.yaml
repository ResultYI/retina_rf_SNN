seed: 19

data:
  train_glob: "runs/synthetic_response_smoke/train.h5"
  validation_glob: "runs/synthetic_response_smoke/validation.h5"
  test_glob: "runs/synthetic_response_smoke/test.h5"
  sequence_steps: 320

model:
  type_prior_path: "configs/rgc_type_priors.yaml"
  support_radius_degs: 0.20
  readout_rate_tau_ms: 50.0
  surrogate_slope: 5.0

training:
  burn_in_steps: 64
  differentiable_steps: 256
  checkpoint_block_steps: 32
  batch_size: 1
  max_optimizer_steps: 2
  learning_rate: 0.0002
  gradient_clip_norm: 1.0
  validation_interval_steps: 1

evaluation:
  rf_lag_steps: 8
  recovery_delays_ms: [0, 100]
